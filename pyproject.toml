[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "synx"
version = "1.0.0"
description = "A command-line syntax and reference tool for Linux and cybersecurity utilities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "synx contributors" }]
keywords = [
    "cli",
    "cheatsheet",
    "reference",
    "security",
    "active-directory",
    "pentest",
    "documentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0", "rich>=13.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.5",
    "build>=1.0",
]

[project.scripts]
synx = "synx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["synx"]

[tool.hatch.build.targets.wheel.force-include]
"tools" = "synx/_bundled_tools"

[tool.hatch.build.targets.sdist]
include = [
    "/synx",
    "/tests",
    "/tools",
    "/README.md",
    "/LICENSE",
    "/requirements.txt",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:synx.*"]

[tool.coverage.run]
branch = true
source = ["synx"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["synx", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["synx", "tests"]

[tool.mypy]
python_version = "3.10"
files = ["synx"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
